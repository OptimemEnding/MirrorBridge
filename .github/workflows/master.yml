name: Android CI and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Source, Flutter, Android, and APK checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify naming and source manifests
        run: |
          python3 scripts/check_naming.py
          python3 scripts/verify_sources.py

      - name: Analyze Flutter sources
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub --concurrency=1

      - name: Run Kotlin and Robolectric tests
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest --console=plain

      - name: Build and inspect debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          python3 scripts/inspect_apk.py build/app/outputs/flutter-apk/app-debug.apk

  validate:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on current master HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          MASTER_COMMIT=$(git rev-parse refs/remotes/origin/master)
          echo "Tag commit: $TAG_COMMIT"
          echo "Master commit: $MASTER_COMMIT"
          if [[ "$TAG_COMMIT" != "$MASTER_COMMIT" ]]; then
            echo "::error::Tag must point to the current master HEAD."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          if [[ -z "$PUBSPEC_VERSION" || "${GITHUB_REF_NAME#v}" != "${PUBSPEC_VERSION%%+*}" ]]; then
            echo "::error::Tag version must match pubspec.yaml ($PUBSPEC_VERSION)."
            exit 1
          fi

  release:
    name: Build signed arm64 APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: flutter test --no-pub --concurrency=1

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mirrorbridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mirrorbridge-release.jks" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      # Flutter must regenerate release plugin registration (exclude integration_test).
      # Do not use --no-pub here after running tests.
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mirrorbridge-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Inspect release APK contents
        run: python3 scripts/inspect_apk.py build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signature and prepare release files
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_NAME="MirrorBridge-${GITHUB_REF_NAME}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "dist/$APK_NAME" | tee dist/signature.txt
          keytool -exportcert -keystore "$RUNNER_TEMP/mirrorbridge-release.jks" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/release-cert.der"
          EXPECTED=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d ' ' -f 1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)
          test "$EXPECTED" = "$ACTUAL"
          python3 - "dist/$APK_NAME" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
          assert abis == {'arm64-v8a'}, f'Unexpected APK ABIs: {abis}'
          print(f'APK ABIs: {sorted(abis)}')
          PY
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          ls -lh dist

      - name: Recheck master HEAD before publishing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/master)" ]]; then
            echo "::error::master moved during the build; refusing to publish."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "MirrorBridge $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mirrorbridge-release.jks" "$RUNNER_TEMP/release-cert.der"
